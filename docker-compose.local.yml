services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_ADMIN_USER:-chat_rag_admin}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_ADMIN_PASSWORD:-local-admin-password}
      POSTGRES_DB: postgres
      LOCAL_MIGRATION_PASSWORD: ${LOCAL_MIGRATION_PASSWORD:-local-migration-password}
      LOCAL_APP_PASSWORD: ${LOCAL_APP_PASSWORD:-local-app-password}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - chat-rag-local-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:8080
      COGNITO_ISSUER: https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_69mO0i9j6
      COGNITO_CLIENT_ID: 5ok5j2hpla2be0gorpdblpheuv
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env.local}
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_GUARDRAIL_ID: wrbzgwf3rz1e
      BEDROCK_GUARDRAIL_VERSION: "1"
      DATABASE_URL: ${LOCAL_API_DATABASE_URL:-postgresql://chat_rag_app:local-app-password@postgres:5432/postgres?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  chat-rag-local-postgres-data:
    name: chat-rag-local-postgres-data
