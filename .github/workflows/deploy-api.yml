name: Deploy API image

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - docs/agents/**
      - .scratch/**
      - AGENTS.md
      - CLAUDE.md

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 385740679214.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: chat-rag-api

jobs:
  guardrail-evaluation:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      BEDROCK_GUARDRAIL_ID: wrbzgwf3rz1e
      BEDROCK_GUARDRAIL_VERSION: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385740679214:role/chat-rag-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Evaluate Bedrock Guardrail
        run: pnpm eval:guardrails

  validate:
    runs-on: ubuntu-latest

    outputs:
      apiDeploymentChanges: ${{ steps.api-deployment-changes.outputs.deploy }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck API
        run: pnpm typecheck:api

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Build API
        run: pnpm build:api

      - name: Build web
        run: pnpm build:web

      - name: Detect API deployment changes
        id: api-deployment-changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          deploy=false
          while IFS= read -r path; do
            case "$path" in
              # Only API source or deployment inputs should publish a production image.
              apps/api/*|infra/*|.github/workflows/deploy-api.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                deploy=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [validate, guardrail-evaluation]
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.apiDeploymentChanges == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385740679214:role/chat-rag-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/task-definition.json
          container-name: chat-rag-api
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to Amazon ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: chat-rag-cluster
          service: chat-rag-api-service
          wait-for-service-stability: true

      - name: Record production deployment identity
        if: always()
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        run: |
          {
            echo '### Production deployment'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE_URI\`"
            echo "- ECS deployment action: \`$DEPLOY_RESULT\`"
            if [[ -n "$TASK_DEFINITION_ARN" ]]; then
              echo "- Task Definition: \`$TASK_DEFINITION_ARN\`"
            else
              echo '- Task Definition: see the ECS action log if registration failed before an ARN was returned'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify ECS service deployment
        env:
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          set -euo pipefail
          service="$(aws ecs describe-services \
            --cluster chat-rag-cluster \
            --services chat-rag-api-service \
            --output json)"
          printf '%s' "$service" | jq --exit-status --arg task_definition "$TASK_DEFINITION_ARN" '
            (.services | length == 1) and
            (.services[0].runningCount == .services[0].desiredCount) and
            any(.services[0].deployments[];
              .status == "PRIMARY" and
              .rolloutState == "COMPLETED" and
              .taskDefinition == $task_definition
            )
          '

      - name: Verify production health
        env:
          HEALTH_URL: https://2780017ujg.execute-api.eu-central-1.amazonaws.com/prod/health
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 10 "$HEALTH_URL")"
          printf '%s' "$response" | jq --exit-status 'type == "object" and .status == "ok"'
